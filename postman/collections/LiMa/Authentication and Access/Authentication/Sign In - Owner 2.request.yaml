$kind: http-request
url: "{{supabase_url}}/auth/v1/token?grant_type=password"
method: POST
headers:
  apikey: "{{publishable_key}}"
  Content-Type: application/json
queryParams:
  grant_type: password
body:
  type: json
  content: "{\r

    \  \"email\": \"{{user2_email}}\",\r

    \  \"password\": \"{{user2_password}}\"\r

    }"
scripts:
  - type: afterResponse
    code: "const data = pm.response.json();\r

      if (data.access_token) {\r

      \  pm.environment.set(\"user2_AT\", data.access_token);\r

      \  pm.environment.set(\"user2_RT\", data.refresh_token);\r

      }"
    language: text/javascript
order: 2000
